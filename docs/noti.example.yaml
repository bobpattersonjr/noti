---
# noti configuration example
# See docs/noti.md or man 5 noti.yaml for full documentation.
#
# Copy this file to one of the locations noti checks, in order:
#   ./.noti.yaml
#   $XDG_CONFIG_HOME/noti/noti.yaml   (default: ~/.config/noti/noti.yaml)
# or pass an explicit path with --file.
#
# Precedence, highest to lowest:
#   1. command line flags
#   2. this file
#   3. NOTI_* environment variables
#   4. built-in defaults
#
# IMPORTANT: a key present in this file overrides the matching NOTI_*
# environment variable, even when the key's value is empty. Delete the
# sections you don't use rather than leaving them blank, or they will
# shadow any environment variables you have set for those services.

# Services triggered when no service flag is given.
defaults:
  - banner

# Default notification message.
message: Done!

# Show command execution time in the message.
time: false

banner:
  # Path to notification icon image. On Linux, accepts an image path or a
  # freedesktop icon theme name. On Windows, accepts an .ico file path.
  # Not supported on macOS, where notifications are sent via osascript.
  icon: ""

nsuser:
  # Banner success sound. Default is Ping. Possible options are Basso, Blow,
  # Bottle, Frog, Funk, Glass, Hero, Morse, Ping, Pop, Purr, Sosumi,
  # Submarine, Tink. See /System/Library/Sounds for available sounds.
  soundName: Ping
  # Banner failure sound. Default is Basso. Same options as soundName.
  soundNameFail: Basso

say:
  # Name of macOS voice used for speech notifications. Run `say -v ?`
  # to list available voices. Default is Alex.
  voice: Alex

espeak:
  # Name of Linux voice used for speech notifications.
  # Default is english-us.
  voiceName: english-us

speechsynthesizer:
  # Name of Windows voice used for speech notifications.
  # Default is Microsoft David Desktop.
  voice: Microsoft David Desktop

blink1:
  # Path to the blink1-tool executable, or a bare name found on PATH.
  path: blink1-tool
  # LED color as an RRGGBB hex string. Default is FF0000 (red).
  color: FF0000
  # Brightness from 0 to 255. 0 uses the device default.
  brightness: 0
  # Milliseconds to wait between blinks.
  delay: 0
  # Milliseconds to fade between colors.
  fade: 0
  # Glimmer the LED N times.
  glimmer: 0
  # Use a random color on each blink. Set to 1 to enable.
  random: 0
  # Number of times to repeat the blink pattern. Default is 3.
  repeats: 3

bearychat:
  # BearyChat incoming URI.
  incomingHookURI: ""

keybase:
  # Keybase message destination. Can be either users (comma-separated) or team.
  conversation: ""
  # Keybase team's chat channel to send to. Conversation must be a team.
  # If empty, the team's default channel will be used (typically "general").
  channel: ""
  # Keybase self-destructing message, after the specified time. Times are
  # written like 30s (30 seconds), 15m (15 minutes), 24h (24 hours).
  explodingLifetime: ""
  # Enables broadcasting a message to everyone (when conversation is
  # your username), or to teams (when conversation is your team name).
  public: false

pushbullet:
  # Pushbullet access token. Log into your Pushbullet account and retrieve a
  # token from the Account Settings page.
  accessToken: ""
  # Pushbullet device iden of the target device, if sending to a single device.
  deviceIden: ""

pushover:
  # Pushover access token. Log into your Pushover account and create a
  # token from the Create New Application/Plugin page.
  apiToken: ""
  # Pushover message destination. Should be your User Key.
  userKey: ""

pushsafer:
  # Pushsafer private or alias key. Log into your Pushsafer account and note
  # your private or alias key.
  key: ""

simplepush:
  # Simplepush key. Install the Simplepush app and retrieve your key there.
  key: ""
  # Customise ringtone and vibration.
  event: ""

slack:
  # Slack access token. Log into your Slack account and retrieve a token
  # from the Slack Web API page.
  token: ""
  # Slack message destination. Can be either a #channel or a @username.
  channel: ""
  # Noti bot username. Default is noti.
  username: noti
  # Slack app URL for deep links (supports NOTI_SLACK_APPURL). Optional.
  appurl: ""

telegram:
  # Telegram access token. The token can be retrieved using the BotFather
  # (https://telegram.me/botfather).
  token: ""
  # Telegram message destination. Can be either a chat or a channel.
  chatId: ""
  # Telegram thread ID. If defined, the message will be posted in the thread;
  # if omitted, the default thread will be used.
  topic: ""

twilio:
  # Twilio access token. Log into your Twilio account and copy the auth token
  # from your project dashboard.
  authToken: ""
  # Twilio account ID. Log into your Twilio account and copy the account SID
  # from your project dashboard.
  accountSid: ""
  # Destination phone number for your SMS message.
  # Format this number with a '+' and a country code, e.g., +16175551212.
  numberTo: ""
  # The Twilio phone number, short code, or Messaging Service that sends
  # this message. Must be a Twilio phone number that you own,
  # formatted with a '+' and country code, e.g. +16175551212 (E.164 format).
  numberFrom: ""

gchat:
  # Google Chat Webhook URL.
  appurl: ""
  # Golang template used for producing the message text. It can include
  # the title and message.
  template: "*{{.title}}*: {{.message}}"

chanify:
  # Chanify sender webhook URL. Create one from the app.
  channelURL: ""
  # Turns on and off the sound (not in silent mode) when a notification
  # is received.
  sound: false
  # Priority number from 1 to 10 used by iOS to order and display
  # relevant notifications.
  priority: 10
  # How the notification appears (whether to show in DnD or not).
  # Use active, passive, or time-sensitive.
  interruptionLevel: active

ntfy:
  # ntfy server URL. Defaults to https://ntfy.sh/.
  url: "https://ntfy.sh/"
  # Topic ID to send messages to.
  topic: ""
  # Bearer access token for authentication on private topics.
  # See https://docs.ntfy.sh/publish/#access-tokens.
  token: ""

bark:
  # Bark server URL. Defaults to https://api.day.app/push.
  apiurl: "https://api.day.app/push"
  # Device key to send messages to.
  key: ""

zulip:
  # Zulip bot API key. Create a bot in your Zulip organization and copy its API key.
  key: ""
  # Zulip bot email address (e.g., bot-name-bot@example.zulipchat.com).
  botAddress: ""
  # Zulip server URL (e.g., https://example.zulipchat.com).
  uri: ""
  # Message type. Can be "private" (default) or "stream".
  type: private
  # Message destination:
  # - For "private": comma-separated list of recipient email addresses.
  # - For "stream": stream name.
  to: ""

webhook:
  # Destination URL for a generic webhook notification.
  url: ""
  # HTTP method. Default is POST. GET and HEAD requests send no body.
  method: POST
  # Content-Type header for the request body. Default is application/json.
  # When it is a JSON type, the title and message are JSON-escaped before
  # being substituted into the template.
  contentType: application/json
  # Go template for the request body. Can reference {{.title}} and
  # {{.message}}.
  template: '{"title":"{{.title}}","message":"{{.message}}"}'
  # Additional HTTP headers as a key/value map. Also settable via
  # NOTI_WEBHOOK_HEADERS as a comma-separated K=V list.
  headers: {}
  #  Authorization: Bearer token123

# Multiple webhooks can be defined as a list under top-level `webhooks`.
# Each entry accepts the same keys as `webhook` above. When set, all
# entries are sent; the single `webhook` block above is ignored.
# webhooks:
#   - url: https://example.com/hook1
#     template: '{"text":"{{.title}}: {{.message}}"}'
#   - url: https://example.com/hook2
#     method: PUT
#     headers:
#       Authorization: Bearer token123

mattermost:
  # Mattermost bot username displayed in the notification. Default is noti.
  username: noti
  # Mattermost channel to post to (e.g., town-square). If empty, the
  # webhook's default channel will be used.
  channel: ""
  # Mattermost incoming webhook URL. Create one in your Mattermost instance
  # under Integrations > Incoming Webhooks.
  incomingHookURI: ""
  # URL of the icon to display for the bot. Overrides the webhook's default
  # icon image.
  iconurl: ""
  # Mattermost post type. Leave empty for standard messages. Can be used to
  # set a custom post type (e.g., for plugin integrations).
  type: ""
