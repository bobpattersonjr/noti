name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-linux-windows:
    name: Build Linux and Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release tarballs (linux, windows)
        run: |
          make release-no-cgo

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-tarballs
          path: |
            out/*.linux-amd64.tar.gz
            out/*.windows-amd64.tar.gz
          if-no-files-found: error

  build-darwin:
    name: Build macOS (darwin)
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release tarball (darwin)
        run: |
          make release-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-tarball
          path: |
            out/*.darwin-amd64.tar.gz
          if-no-files-found: error

  man-pages:
    name: Build man pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate man pages
        run: |
          make man

      - name: Upload man pages
        uses: actions/upload-artifact@v4
        with:
          name: man-pages
          path: |
            docs/man/dist/noti.1
            docs/man/dist/noti.yaml.5
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux-windows
      - build-darwin
      - man-pages
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: |
          echo "Listing downloaded artifacts:"
          ls -lah dist || true
          echo "Recursive listing:"
          find dist -type f -maxdepth 4 -print || true

      - name: Publish release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/noti.1
            dist/**/noti.yaml.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
