name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release tarball (linux)
        run: |
          make release-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: |
            out/*.linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release tarball (windows)
        run: |
          make release-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-tarball
          path: |
            out/*.windows-amd64.tar.gz
          if-no-files-found: error

  build-darwin:
    name: Build macOS (darwin amd64)
    # macos-13 (the last free Intel runner) is retired. All builds are pure Go
    # since the osascript banner change (#168) removed cgo, so amd64
    # cross-compiles fine on the arm64 runner.
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release tarball (darwin amd64)
        run: |
          make release-darwin-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: darwin-tarball
          path: |
            out/*.darwin-amd64.tar.gz
          if-no-files-found: error

  build-darwin-arm64:
    name: Build macOS (darwin arm64)
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release tarball (darwin arm64)
        run: |
          make release-darwin-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64-tarball
          path: |
            out/*.darwin-arm64.tar.gz
          if-no-files-found: error


  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-darwin
      - build-darwin-arm64
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: |
          echo "Listing downloaded artifacts:"
          ls -lah dist || true
          echo "Recursive listing:"
          find dist -type f -maxdepth 4 -print || true

      - name: Publish release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
